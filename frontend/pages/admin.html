<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — User Management System</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { background: var(--bg); }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--teal);
    }

    .stat-card.accent1 { border-left-color: var(--peach); }
    .stat-card.accent2 { border-left-color: var(--amber); }
    .stat-card.accent3 { border-left-color: var(--coral); }

    .stat-number {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* Filters */
    .filters-row {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--teal);
    }

    .filter-group input,
    .filter-group select {
      padding: 0.6rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: border-color var(--transition);
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--teal);
      outline: none;
    }

    /* Users Table */
    .users-table-container {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
    }

    .users-table thead {
      background: var(--bg);
      border-bottom: 2px solid var(--border);
    }

    .users-table th {
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--teal);
    }

    .users-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .users-table tbody tr:hover {
      background: rgba(74, 97, 99, 0.04);
    }

    .users-table td {
      padding: 0.85rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--teal);
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    .user-avatar-placeholder {
      display: inline-flex;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--teal);
      color: var(--white);
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      margin-right: 0.5rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-active {
      background: rgba(74, 97, 99, 0.15);
      color: var(--teal);
    }

    .status-inactive {
      background: rgba(241, 122, 126, 0.15);
      color: var(--coral);
    }

    .role-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255, 201, 75, 0.2);
      color: #8a6d00;
    }

    .role-badge.admin {
      background: rgba(249, 166, 108, 0.2);
      color: #a65e3a;
    }

    /* Table Actions */
    .table-actions {
      display: flex;
      gap: 0.4rem;
    }

    .action-btn {
      padding: 0.4rem 0.7rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: var(--radius);
      transition: all var(--transition);
    }

    .action-view {
      color: var(--teal);
      border: 1px solid var(--teal);
    }

    .action-view:hover {
      background: var(--teal);
      color: var(--white);
    }

    .action-toggle {
      color: var(--amber);
      border: 1px solid var(--amber);
    }

    .action-toggle:hover {
      background: var(--amber);
      color: var(--white);
    }

    .action-delete {
      color: var(--coral);
      border: 1px solid var(--coral);
    }

    .action-delete:hover {
      background: var(--coral);
      color: var(--white);
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .pagination-btn {
      padding: 0.5rem 0.75rem;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--text);
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all var(--transition);
    }

    .pagination-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .pagination-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--white);
    }

    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }

    /* User Detail Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.visible {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: color var(--transition);
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--teal);
      margin-bottom: 1.5rem;
    }

    .modal-field {
      margin-bottom: 1rem;
    }

    .modal-field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .modal-field span {
      font-size: 0.95rem;
      color: var(--text);
      word-break: break-word;
    }

    /* Loading */
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(74, 97, 99, 0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-row {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .filters-row {
        grid-template-columns: 1fr;
      }

      .users-table {
        font-size: 0.8rem;
      }

      .users-table th,
      .users-table td {
        padding: 0.6rem 0.5rem;
      }

      .table-actions {
        flex-direction: column;
      }

      .action-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="navbar-brand">
    <div class="navbar-brand-icon">⚙️</div>
    Admin Dashboard
  </div>

  <div class="navbar-right">
    <div class="navbar-user-info">
      <div class="name" id="navName">Loading...</div>
      <div class="role" id="navRole">admin</div>
    </div>
    <div id="navAvatarWrap"></div>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>
</nav>

<!-- ── Main Content ──────────────────────────────────────────── -->
<main class="dashboard-body">

  <!-- Alert -->
  <div class="alert" id="dashAlert" style="margin-bottom:1.5rem;"></div>

  <h1 style="font-family:var(--font-display); color:var(--teal); margin-bottom:0.5rem;">
    User Management
  </h1>
  <p style="color:var(--text-muted); margin-bottom:2rem;">
    Manage all system users, roles, and account status.
  </p>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number" id="stat-total">—</div>
      <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-card accent1">
      <div class="stat-number" id="stat-admins">—</div>
      <div class="stat-label">Admins</div>
    </div>
    <div class="stat-card accent2">
      <div class="stat-number" id="stat-active">—</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-card accent3">
      <div class="stat-number" id="stat-inactive">—</div>
      <div class="stat-label">Inactive</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-row">
    <div class="filter-group">
      <label for="searchInput">Search</label>
      <input
        type="text"
        id="searchInput"
        placeholder="Name, email..."
        onkeyup="debounceSearch()"
      />
    </div>
    <div class="filter-group">
      <label for="roleFilter">Role</label>
      <select id="roleFilter" onchange="applyFilters()">
        <option value="">All Roles</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="statusFilter">Status</label>
      <select id="statusFilter" onchange="applyFilters()">
        <option value="all">All</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="limitSelect">Per Page</label>
      <select id="limitSelect" onchange="applyFilters()">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
    </div>
  </div>

  <!-- Users Table -->
  <div class="users-table-container">
    <table class="users-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Joined</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr class="loading-row">
          <td colspan="6">
            <span class="loading-spinner"></span> Loading users...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>

</main>

<!-- ── User Detail Modal ──────────────────────────────────────── -->
<div class="modal" id="userModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">User Details</div>

    <div id="modalBody"></div>

    <div style="display:flex; gap:1rem; margin-top:1.5rem;">
      <button class="btn btn-primary" id="modalToggleBtn" onclick="toggleUserStatus()">
        Disable
      </button>
      <button class="btn btn-outline" id="modalRoleBtn" onclick="changeUserRole()">
        Change Role
      </button>
      <button class="btn" style="background:none; border:1.5px solid var(--coral); color:var(--coral); margin-left:auto;" onclick="deleteUserConfirm()">
        Delete
      </button>
    </div>
  </div>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
